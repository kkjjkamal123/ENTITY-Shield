# Builds ExecuTorch v1.5.1's Android library (arm64) with scripts/executorch/patch_threads.py applied,
# and swaps it into the official executorch-android 1.5.1 AAR (same Java classes, patched JNI .so).
# Output: android-app/app/libs/executorch-android-1.5.1-shield.aar, as a workflow artifact.
name: ExecuTorch Android (patched threads)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      ET_TAG: v1.5.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
          df -h /

      - name: Clone ExecuTorch
        run: |
          git clone --depth 1 --branch "$ET_TAG" https://github.com/pytorch/executorch.git executorch
          cd executorch && git submodule update --init --recursive --depth 1 --jobs 8

      - name: Patch thread selection
        run: python scripts/executorch/patch_threads.py executorch

      - name: Python build requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install "cmake>=3.26,<4" pyyaml zstd certifi packaging setuptools wheel ruamel.yaml
          python -m pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu

      - name: Build libexecutorch.so (arm64-v8a)
        working-directory: executorch
        env:
          PYTHON_EXECUTABLE: python
        run: |
          export ANDROID_NDK="$ANDROID_NDK_LATEST_HOME"
          echo "NDK: $ANDROID_NDK"
          source scripts/build_android_library.sh
          build_android_native_library arm64-v8a
          "$ANDROID_NDK"/toolchains/llvm/prebuilt/*/bin/llvm-strip cmake-out-android-so/arm64-v8a/libexecutorch.so
          ls -la cmake-out-android-so/arm64-v8a

      - name: Swap into the official AAR
        run: |
          curl -sSfLo official.aar https://repo1.maven.org/maven2/org/pytorch/executorch-android/1.5.1/executorch-android-1.5.1.aar
          mkdir aar && cd aar && unzip -q ../official.aar
          rm -rf jni/x86_64
          cp ../executorch/cmake-out-android-so/arm64-v8a/libexecutorch.so jni/arm64-v8a/libexecutorch.so
          mkdir -p ../out && zip -qr -X ../out/executorch-android-1.5.1-shield.aar .
          cd .. && sha256sum out/*.aar | tee out/SHA256SUMS.txt
          grep -c "ET_NUM_THREADS" aar/jni/arm64-v8a/libexecutorch.so

      - uses: actions/upload-artifact@v4
        with:
          name: executorch-android-1.5.1-shield
          path: out/
